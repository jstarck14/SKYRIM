<!DOCTYPE html>
<html>
<head>
    <title>Skyrim Memory Palace</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #0b0d12; font-family: sans-serif; }
        #map { width: 100vw; height: 100vh; background: #0b0d12; }
        
        .leaflet-container { background: #0b0d12 !important; }

        /* Dark Medieval Parchment Vector Styling */
        .skyrim-svg-path {
            fill: #1a1d24;
            stroke: #4a5568;
            stroke-width: 2;
            transition: fill 0.2s;
        }
        .skyrim-svg-path:hover {
            fill: #2d3748;
        }

        .leaflet-popup-content-wrapper {
            background: #1c1e24;
            color: #f0f0f0;
            border-radius: 8px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.7);
            border: 1px solid #3d414d;
            padding: 4px;
        }
        .leaflet-popup-tip { background: #1c1e24; }
        .popup-card { width: 220px; }
        .popup-card b { color: #4da6ff; font-size: 14px; }
        .popup-card textarea {
            width: 95%;
            height: 80px;
            margin-top: 8px;
            margin-bottom: 8px;
            background: #2a2d36;
            color: #ffffff;
            border: 1px solid #3d414d;
            border-radius: 4px;
            padding: 6px;
            resize: vertical;
            font-family: inherit;
            font-size: 13px;
        }
        .popup-card button {
            background: #007aff;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }
        .popup-card button:hover { background: #0056b3; }
        .saved-note {
            margin-top: 6px;
            font-size: 13px;
            line-height: 1.4;
            color: #d1d5db;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        
        #banner {
            position: absolute;
            top: 10px;
            left: 50px;
            z-index: 1000;
            background: rgba(15, 17, 23, 0.92);
            color: #ffffff;
            padding: 8px 14px;
            border-radius: 6px;
            border: 1px solid #2a2d36;
            font-size: 13px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="banner">
        <b>Skyrim Vector Palace:</b> Scroll/Pinch to zoom, click anywhere to drop pins.
    </div>
    <div id="map"></div>

    <script>
        // Setup simple Leaflet coordinate space
        var map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: -1,
            maxZoom: 4,
            zoomSnap: 0.25,
            wheelPxPerZoomLevel: 90
        });

        var bounds = [[0, 0], [1000, 1000]];

        // Build native inline SVG element representing Skyrim Holds
        var svgElement = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svgElement.setAttribute('xmlns', "http://www.w3.org/2000/svg");
        svgElement.setAttribute('viewBox', "0 0 1000 1000");
        svgElement.innerHTML = `
            <rect width="1000" height="1000" fill="#0b0d12"/>
            <!-- Haafingar / Solitude -->
            <path class="skyrim-svg-path" d="M 150,200 L 350,150 L 400,300 L 250,350 Z" />
            <text x="240" y="240" fill="#a0aec0" font-size="22" font-weight="bold">Haafingar (Solitude)</text>

            <!-- Hjaalmarch / Morthal -->
            <path class="skyrim-svg-path" d="M 350,150 L 550,180 L 500,400 L 400,300 Z" />
            <text x="430" y="260" fill="#a0aec0" font-size="22" font-weight="bold">Hjaalmarch</text>

            <!-- The Pale / Dawnstar -->
            <path class="skyrim-svg-path" d="M 550,180 L 750,150 L 700,380 L 500,400 Z" />
            <text x="600" y="250" fill="#a0aec0" font-size="22" font-weight="bold">The Pale</text>

            <!-- Winterhold -->
            <path class="skyrim-svg-path" d="M 750,150 L 950,200 L 880,420 L 700,380 Z" />
            <text x="780" y="270" fill="#a0aec0" font-size="22" font-weight="bold">Winterhold</text>

            <!-- Whiterun Hold -->
            <path class="skyrim-svg-path" d="M 300,400 L 700,380 L 650,650 L 250,600 Z" />
            <text x="450" y="520" fill="#63b3ed" font-size="28" font-weight="bold">Whiterun Hold</text>

            <!-- The Reach / Markarth -->
            <path class="skyrim-svg-path" d="M 50,350 L 300,400 L 250,600 L 80,750 Z" />
            <text x="130" y="500" fill="#a0aec0" font-size="22" font-weight="bold">The Reach</text>

            <!-- Falkreath Hold -->
            <path class="skyrim-svg-path" d="M 250,600 L 650,650 L 600,900 L 150,850 Z" />
            <text x="360" y="750" fill="#a0aec0" font-size="22" font-weight="bold">Falkreath</text>

            <!-- Eastmarch / Windhelm -->
            <path class="skyrim-svg-path" d="M 700,380 L 950,420 L 900,700 L 650,650 Z" />
            <text x="740" y="530" fill="#a0aec0" font-size="22" font-weight="bold">Eastmarch</text>

            <!-- The Rift / Riften -->
            <path class="skyrim-svg-path" d="M 650,650 L 900,700 L 850,920 L 600,900 Z" />
            <text x="720" y="800" fill="#a0aec0" font-size="22" font-weight="bold">The Rift</text>
        `;

        // Render SVG Vector Overlay into Leaflet engine
        L.svgOverlay(svgElement, bounds).addTo(map);
        map.fitBounds(bounds);
        map.setMaxBounds(bounds);

        // Click handler: pins lock directly to map coordinates
        map.on('click', function(e) {
            var marker = L.marker(e.latlng).addTo(map);
            
            var container = document.createElement('div');
            container.className = 'popup-card';
            
            container.innerHTML = `
                <b>Location Note</b>
                <textarea placeholder="Type medical / body system notes..."></textarea>
                <button class="save-btn">Save Note</button>
            `;

            var textarea = container.querySelector('textarea');
            var saveBtn = container.querySelector('.save-btn');

            saveBtn.onclick = function() {
                var textVal = textarea.value.trim();
                if (!textVal) return;
                
                container.innerHTML = `
                    <b>Location Note</b>
                    <div class="saved-note">${textVal.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</div>
                    <button class="edit-btn" style="margin-top:10px; background:#3a3f4d;">Edit Note</button>
                `;
                
                container.querySelector('.edit-btn').onclick = function() {
                    container.innerHTML = `
                        <b>Location Note</b>
                        <textarea>${textVal}</textarea>
                        <button class="save-btn">Save Note</button>
                    `;
                    container.querySelector('.save-btn').onclick = saveBtn.onclick;
                };
            };

            marker.bindPopup(container).openPopup();
        });
    </script>
</body>
</html>
