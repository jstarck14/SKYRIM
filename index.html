<!DOCTYPE html>
<html>
<head>
    <title>Skyrim Memory Palace</title>
    <!-- Native UESP Map Engine & CSS -->
    <link rel="stylesheet" href="https://maps.uesp.net/srmap/leaflet.css" />
    <script src="https://maps.uesp.net/srmap/leaflet.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: #0b0d12;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        #map {
            width: 100vw;
            height: 100vh;
            background: #0b0d12;
        }

        .leaflet-popup-content-wrapper {
            background: #1c1e24;
            color: #f0f0f0;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            border: 1px solid #3d414d;
            padding: 4px;
        }

        .leaflet-popup-tip { background: #1c1e24; }

        .popup-card { width: 230px; }
        .popup-card b { color: #4da6ff; font-size: 14px; }
        .popup-card textarea {
            width: 93%;
            height: 85px;
            margin-top: 8px;
            margin-bottom: 8px;
            background: #2a2d36;
            color: #ffffff;
            border: 1px solid #3d414d;
            border-radius: 4px;
            padding: 6px;
            resize: vertical;
            font-family: inherit;
            font-size: 13px;
        }

        .popup-card button {
            background: #007aff;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }

        .saved-note {
            margin-top: 6px;
            font-size: 13px;
            line-height: 1.4;
            color: #d1d5db;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        #banner {
            position: absolute;
            top: 10px;
            left: 50px;
            z-index: 1000;
            background: rgba(15, 17, 23, 0.92);
            color: #ffffff;
            padding: 8px 14px;
            border-radius: 6px;
            border: 1px solid #2a2d36;
            font-size: 13px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="banner">
        <b>Skyrim Memory Palace:</b> High-Res UESP Vector Map Active. Click to drop notes.
    </div>
    <div id="map"></div>

    <script>
        // Native UESP flat coordinate space
        var map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: 9,
            maxZoom: 17,
            zoomSnap: 0.5
        });

        // UESP Open Vector Map Server Endpoint
        L.tileLayer('https://maps.uesp.net/srmap/zoom{z}/skyrim-{x}-{y}.png', {
            attribution: 'Map Data &copy; UESP.net',
            minZoom: 9,
            maxZoom: 17,
            tileSize: 256,
            noWrap: true
        }).addTo(map);

        // Center view on central Skyrim (Whiterun Plains area)
        map.setView([-60, 40], 11);

        // Click handler: Pins stay permanently locked to map locations
        map.on('click', function(e) {
            var marker = L.marker(e.latlng).addTo(map);
            
            var container = document.createElement('div');
            container.className = 'popup-card';
            
            container.innerHTML = `
                <b>Location Note</b>
                <textarea placeholder="Type medical / body system notes..."></textarea>
                <button class="save-btn">Save Note</button>
            `;

            var textarea = container.querySelector('textarea');
            var saveBtn = container.querySelector('.save-btn');

            saveBtn.onclick = function() {
                var textVal = textarea.value.trim();
                if (!textVal) return;
                
                container.innerHTML = `
                    <b>Location Note</b>
                    <div class="saved-note">${textVal.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</div>
                    <button class="edit-btn" style="margin-top:10px; background:#2a2d36;">Edit Note</button>
                `;
                
                container.querySelector('.edit-btn').onclick = function() {
                    container.innerHTML = `
                        <b>Location Note</b>
                        <textarea>${textVal}</textarea>
                        <button class="save-btn">Save Note</button>
                    `;
                    container.querySelector('.save-btn').onclick = saveBtn.onclick;
                };
            };

            marker.bindPopup(container).openPopup();
        });
    </script>
</body>
</html>
