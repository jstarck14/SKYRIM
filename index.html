<!DOCTYPE html>
<html>
<head>
    <title>Skyrim Memory Palace</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: #0d0f14;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        #map {
            width: 100vw;
            height: 100vh;
            background: #0d0f14;
        }

        .leaflet-popup-content-wrapper {
            background: #1c1e24;
            color: #f0f0f0;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            border: 1px solid #3d414d;
            padding: 4px;
        }

        .leaflet-popup-tip { background: #1c1e24; }

        .popup-card { width: 230px; }
        .popup-card b { color: #4da6ff; font-size: 14px; }
        .popup-card textarea {
            width: 93%;
            height: 85px;
            margin-top: 8px;
            margin-bottom: 8px;
            background: #2a2d36;
            color: #ffffff;
            border: 1px solid #3d414d;
            border-radius: 4px;
            padding: 6px;
            resize: vertical;
            font-family: inherit;
            font-size: 13px;
        }

        .popup-card button {
            background: #007aff;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }

        .saved-note {
            margin-top: 6px;
            font-size: 13px;
            line-height: 1.4;
            color: #d1d5db;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        #banner {
            position: absolute;
            top: 10px;
            left: 50px;
            z-index: 1000;
            background: rgba(15, 17, 23, 0.92);
            color: #ffffff;
            padding: 8px 14px;
            border-radius: 6px;
            border: 1px solid #2a2d36;
            font-size: 13px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="banner">
        <b>Skyrim Memory Palace:</b> Scroll to zoom, click anywhere to drop study notes.
    </div>
    <div id="map"></div>

    <script>
        // Native flat coordinate space
        var map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: -1,
            maxZoom: 3,
            zoomSnap: 0.25
        });

        var bounds = [[0, 0], [800, 1200]];

        // Generate procedural canvas vector map
        var canvas = document.createElement('canvas');
        canvas.width = 1200;
        canvas.height = 800;
        var ctx = canvas.getContext('2d');

        // Background / Sea
        ctx.fillStyle = '#111622';
        ctx.fillRect(0, 0, 1200, 800);

        // Holds Definition Data
        var holds = [
            { name: "Haafingar (Solitude)", path: [[100,200], [250,150], [380,280], [220,350]], color: "#1e293b", label: [240, 240] },
            { name: "Hjaalmarch (Mortal)", path: [[380,280], [520,200], [580,340], [420,400]], color: "#1e2430", label: [470, 300] },
            { name: "The Pale (Dawnstar)", path: [[520,200], [750,180], [780,360], [580,340]], color: "#1c2836", label: [650, 270] },
            { name: "Winterhold", path: [[750,180], [1050,150], [1020,380], [780,360]], color: "#192231", label: [900, 260] },
            { name: "The Reach (Markarth)", path: [[80,380], [300,360], [320,680], [100,650]], color: "#17202a", label: [200, 520] },
            { name: "Whiterun Hold", path: [[300,360], [700,350], [720,580], [320,600]], color: "#1c2d42", label: [510, 470] },
            { name: "Eastmarch (Windhelm)", path: [[780,360], [1100,380], [1080,680], [720,580]], color: "#182635", label: [920, 500] },
            { name: "Falkreath Hold", path: [[320,600], [650,580], [600,750], [300,720]], color: "#1b252e", label: [460, 670] },
            { name: "The Rift (Riften)", path: [[650,580], [1080,680], [1000,780], [600,750]], color: "#212b33", label: [820, 710] }
        ];

        // Draw Holds
        holds.forEach(function(hold) {
            ctx.beginPath();
            ctx.moveTo(hold.path[0][0], hold.path[0][1]);
            for(var i = 1; i < hold.path.length; i++) {
                ctx.lineTo(hold.path[i][0], hold.path[i][1]);
            }
            ctx.closePath();
            ctx.fillStyle = hold.color;
            ctx.fill();
            ctx.strokeStyle = '#3b82f6';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Render Region Labels
            ctx.fillStyle = '#e2e8f0';
            ctx.font = 'bold 16px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(hold.name, hold.label[0], hold.label[1]);
        });

        // Overlay generated canvas image into Leaflet
        var dataUrl = canvas.toDataURL();
        L.imageOverlay(dataUrl, bounds).addTo(map);
        map.fitBounds(bounds);
        map.setMaxBounds(bounds);

        // Click Handler: Pin placement
        map.on('click', function(e) {
            var marker = L.marker(e.latlng).addTo(map);
            
            var container = document.createElement('div');
            container.className = 'popup-card';
            
            container.innerHTML = `
                <b>Location Note</b>
                <textarea placeholder="Type medical / body system notes..."></textarea>
                <button class="save-btn">Save Note</button>
            `;

            var textarea = container.querySelector('textarea');
            var saveBtn = container.querySelector('.save-btn');

            saveBtn.onclick = function() {
                var textVal = textarea.value.trim();
                if (!textVal) return;
                
                container.innerHTML = `
                    <b>Location Note</b>
                    <div class="saved-note">${textVal.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</div>
                    <button class="edit-btn" style="margin-top:10px; background:#2a2d36;">Edit Note</button>
                `;
                
                container.querySelector('.edit-btn').onclick = function() {
                    container.innerHTML = `
                        <b>Location Note</b>
                        <textarea>${textVal}</textarea>
                        <button class="save-btn">Save Note</button>
                    `;
                    container.querySelector('.save-btn').onclick = saveBtn.onclick;
                };
            };

            marker.bindPopup(container).openPopup();
        });
    </script>
</body>
</html>
