<!DOCTYPE html>
<html>
<head>
    <title>Skyrim Memory Palace</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #080a0f; font-family: sans-serif; }
        #map { width: 100vw; height: 100vh; background: #080a0f; }
        
        .leaflet-popup-content-wrapper {
            background: #1c1e24;
            color: #f0f0f0;
            border-radius: 8px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.6);
            padding: 4px;
        }
        .leaflet-popup-tip { background: #1c1e24; }
        .popup-card { width: 220px; }
        .popup-card b { color: #4da6ff; font-size: 14px; }
        .popup-card textarea {
            width: 95%;
            height: 80px;
            margin-top: 8px;
            margin-bottom: 8px;
            background: #2a2d36;
            color: #ffffff;
            border: 1px solid #3d414d;
            border-radius: 4px;
            padding: 6px;
            resize: vertical;
            font-family: inherit;
            font-size: 13px;
        }
        .popup-card button {
            background: #007aff;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }
        .popup-card button:hover { background: #0056b3; }
        .saved-note {
            margin-top: 6px;
            font-size: 13px;
            line-height: 1.4;
            color: #d1d5db;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        
        #banner {
            position: absolute;
            top: 10px;
            left: 50px;
            z-index: 1000;
            background: rgba(15, 17, 23, 0.9);
            color: #ffffff;
            padding: 8px 14px;
            border-radius: 6px;
            border: 1px solid #2a2d36;
            font-size: 13px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="banner">
        <b>Skyrim Memory Palace:</b> Click anywhere to drop a pin & add notes.
    </div>
    <div id="map"></div>

    <script>
        // Custom flat coordinate system for high-resolution Skyrim tiles
        var map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: 1,
            maxZoom: 5,
            zoomSnap: 0.5
        }).setView([-128, 128], 2);

        var bounds = [[-256, 0], [0, 256]];

        // Direct Skyrim map tile server
        L.tileLayer('https://raw.githubusercontent.com/skora/skyrim-map/master/tiles/{z}/{x}/{y}.png', {
            tileSize: 256,
            minZoom: 1,
            maxZoom: 5,
            noWrap: true,
            bounds: bounds
        }).addTo(map);

        map.setMaxBounds(bounds);

        // Click event to drop interactive study pins
        map.on('click', function(e) {
            var marker = L.marker(e.latlng).addTo(map);
            
            var container = document.createElement('div');
            container.className = 'popup-card';
            
            container.innerHTML = `
                <b>Location Note</b>
                <textarea placeholder="Type medical / body system notes..."></textarea>
                <button class="save-btn">Save Note</button>
            `;

            var textarea = container.querySelector('textarea');
            var saveBtn = container.querySelector('.save-btn');

            saveBtn.onclick = function() {
                var textVal = textarea.value.trim();
                if (!textVal) return;
                
                container.innerHTML = `
                    <b>Location Note</b>
                    <div class="saved-note">${textVal.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</div>
                    <button class="edit-btn" style="margin-top:10px; background:#3a3f4d;">Edit Note</button>
                `;
                
                container.querySelector('.edit-btn').onclick = function() {
                    container.innerHTML = `
                        <b>Location Note</b>
                        <textarea>${textVal}</textarea>
                        <button class="save-btn">Save Note</button>
                    `;
                    container.querySelector('.save-btn').onclick = saveBtn.onclick;
                };
            };

            marker.bindPopup(container).openPopup();
        });
    </script>
</body>
</html>
