<!DOCTYPE html>
<html>
<head>
    <title>Skyrim Memory Palace</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #0c0e14; font-family: sans-serif; }
        #map { width: 100vw; height: 100vh; background: #0c0e14; }
        
        .leaflet-container { background: #0c0e14 !important; }
        
        /* Dark Skyrim Parchment Map Tiles */
        .skyrim-tile {
            filter: sepia(0.6) hue-rotate(190deg) contrast(1.2) brightness(0.6) invert(0.9);
        }

        .leaflet-popup-content-wrapper {
            background: #181a20;
            color: #e2e8f0;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.8);
            border: 1px solid #2d3748;
            padding: 4px;
        }
        .leaflet-popup-tip { background: #181a20; }
        .popup-card { width: 230px; }
        .popup-card b { color: #63b3ed; font-size: 14px; }
        .popup-card textarea {
            width: 93%;
            height: 85px;
            margin-top: 8px;
            margin-bottom: 8px;
            background: #2d3748;
            color: #ffffff;
            border: 1px solid #4a5568;
            border-radius: 4px;
            padding: 6px;
            resize: vertical;
            font-family: inherit;
            font-size: 13px;
        }
        .popup-card button {
            background: #3182ce;
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }
        .popup-card button:hover { background: #2b6cb0; }
        .saved-note {
            margin-top: 6px;
            font-size: 13px;
            line-height: 1.4;
            color: #cbd5e0;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        
        #banner {
            position: absolute;
            top: 12px;
            left: 50px;
            z-index: 1000;
            background: rgba(15, 17, 23, 0.92);
            color: #e2e8f0;
            padding: 8px 14px;
            border-radius: 6px;
            border: 1px solid #2d3748;
            font-size: 13px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="banner">
        <b>Skyrim Memory Palace:</b> Click anywhere to drop a pin & add medical notes.
    </div>
    <div id="map"></div>

    <script>
        var map = L.map('map', {
            minZoom: 3,
            maxZoom: 7
        }).setView([20, 0], 3);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: 'Skyrim Memory Palace',
            className: 'skyrim-tile',
            noWrap: true
        }).addTo(map);

        map.on('click', function(e) {
            var marker = L.marker(e.latlng).addTo(map);
            
            var container = document.createElement('div');
            container.className = 'popup-card';
            
            container.innerHTML = `
                <b>Location Note</b>
                <textarea placeholder="Type medical / body system notes..."></textarea>
                <button class="save-btn">Save Note</button>
            `;

            var textarea = container.querySelector('textarea');
            var saveBtn = container.querySelector('.save-btn');

            saveBtn.onclick = function() {
                var textVal = textarea.value.trim();
                if (!textVal) return;
                
                container.innerHTML = `
                    <b>Location Note</b>
                    <div class="saved-note">${textVal.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</div>
                    <button class="edit-btn" style="margin-top:10px; background:#4a5568;">Edit Note</button>
                `;
                
                container.querySelector('.edit-btn').onclick = function() {
                    container.innerHTML = `
                        <b>Location Note</b>
                        <textarea>${textVal}</textarea>
                        <button class="save-btn">Save Note</button>
                    `;
                    container.querySelector('.save-btn').onclick = saveBtn.onclick;
                };
            };

            marker.bindPopup(container).openPopup();
        });
    </script>
</body>
</html>
